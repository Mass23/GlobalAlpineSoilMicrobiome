name: globalalpine-r
channels:
  - conda-forge
dependencies:
  - r-base>=4.2
  - r-essentials
  - gdal
  - proj
  - geos
  - libgdal
  - libcurl
  - curl
  - openssl
  - r-terra
  - r-sf
  - r-httr
  - r-jsonlite
  - r-curl
  - r-devtools
  - r-soildb
  - r-copernicusdem  # optional: may not be available on all channels; install from CRAN if missing
  - snakemake
  - python=3.12  # keep minimal python for utilities if needed
  - pip

# Notes:
# - This environment contains the R packages required to run scripts/extract_r.R
# - If a package is not available on conda-forge (e.g. r-copernicusdem), install it from CRAN inside the env:
#     conda activate globalalpine-r
#     R -e "install.packages('CopernicusDEM', repos='https://cloud.r-project.org')"
# - To create this env: mamba env create -f envs/conda_env.yml
# - To run the R extractor: conda activate globalalpine-r && Rscript scripts/extract_r.R
