name: globalalpine-r-download
channels:
  - conda-forge
dependencies:
  - r-base>=4.2
  - r-essentials
  - gdal
  - proj
  - geos
  - libgdal
  - libcurl
  - curl
  - openssl
  - r-terra
  - r-sf
  - r-httr
  - r-jsonlite
  - r-curl
  - r-devtools
  - r-soildb
  - r-dplyr
  - r-xml2
  - r-remotes
  - python=3.12
  - pip

# Post-install note
# Some required R packages are not available as conda packages on conda-forge
# (notably CopernicusDEM and possibly rchelsa). After creating the env, run the
# provided helper script to install CRAN-only packages into the activated environment:
#
#   conda activate globalalpine-r-download
#   bash scripts/install_r_packages.sh
#
# This script currently installs: CopernicusDEM
# Add other CRAN packages to scripts/install_r_packages.sh if needed.

# Create env:
#   mamba env create -f envs/conda_env_r_geodata-download.yml
# Run extractor:
#   conda activate globalalpine-r-download
#   Rscript scripts/extract_r.R
