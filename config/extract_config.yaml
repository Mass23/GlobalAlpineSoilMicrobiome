# Example extraction config. Replace paths with your local COGs or HTTP COG endpoints.

points_csv: "data/points.csv"   # CSV with lon,lat and optional depth_cm
depth_col: "depth_cm"           # set to null or remove to disable per-point depth

output:
  path: "results/sampled_soilgrids.parquet"
  r_path: "results/sampled_soilgrids_r.csv"

# SoilGrids variable mapping: var -> band_label -> path
# Band labels must match: "0-5","5-15","15-30","30-60","60-100","100-200"
# Using official ISRIC SoilGrids VRT endpoints (remote VRTs that reference tiles).
soil_vars:
  soc:
    "0-5": "https://files.isric.org/soilgrids/latest/data/soc/soc_0-5cm_mean.vrt"
    "5-15": "https://files.isric.org/soilgrids/latest/data/soc/soc_5-15cm_mean.vrt"
    "15-30": "https://files.isric.org/soilgrids/latest/data/soc/soc_15-30cm_mean.vrt"
    "30-60": "https://files.isric.org/soilgrids/latest/data/soc/soc_30-60cm_mean.vrt"
    "60-100": "https://files.isric.org/soilgrids/latest/data/soc/soc_60-100cm_mean.vrt"
    "100-200": "https://files.isric.org/soilgrids/latest/data/soc/soc_100-200cm_mean.vrt"
  phh2o:
    "0-5": "https://files.isric.org/soilgrids/latest/data/phh2o/phh2o_0-5cm_mean.vrt"
    "5-15": "https://files.isric.org/soilgrids/latest/data/phh2o/phh2o_5-15cm_mean.vrt"
    "15-30": "https://files.isric.org/soilgrids/latest/data/phh2o/phh2o_15-30cm_mean.vrt"
    "30-60": "https://files.isric.org/soilgrids/latest/data/phh2o/phh2o_30-60cm_mean.vrt"
    "60-100": "https://files.isric.org/soilgrids/latest/data/phh2o/phh2o_60-100cm_mean.vrt"
    "100-200": "https://files.isric.org/soilgrids/latest/data/phh2o/phh2o_100-200cm_mean.vrt"

# CHELSA single-band rasters (BIO1..BIO19, freezing vars, monthly if needed)
# Using the ENVICloud / OS Zurich mirror for CHELSA v2.1 climatologies (SCD = snow cover days)
chelsa:
  scd_1981_2010: "https://os.zhdk.cloud.switch.ch/chelsav2/GLOBAL/climatologies/1981-2010/bio/CHELSA_scd_1981-2010_V.2.1.tif"
  # add other CHELSA bio variables as needed; populate only verified URLs

# DEM (Copernicus) COG - recommend using Microsoft Planetary Computer STAC to resolve Copernicus DEM or SRTM COGs
# The extractor can resolve STAC collections to concrete COG asset URLs at runtime; provide collection + asset keys here.
# Example resolver behavior: query the Planetary Computer STAC for an item covering the point/date, then use the item's asset href (HTTP COG) for sampling.

dem:
  source: "planetary_computer"
  collection: "copernicus-dem"   # Planetary Computer collection id for Copernicus DEM on PC
  asset: "DEM"                   # asset key to use from STAC item
  description: "Resolve Copernicus DEM COG via Planetary Computer STAC; fall back to SRTM if not available"

# Landcover (ESA WorldCover 10m) via Planetary Computer STAC
landcover:
  source: "planetary_computer"
  collection: "esa-worldcover"   # ESA WorldCover collection on Planetary Computer
  asset: "map"                   # asset key containing the COG
  description: "ESA WorldCover 10m (2020) COG asset 'map' available via STAC"

# NDVI: compute from Sentinel-2 L2A bands (B04 = red, B08 = nir) available as COGs on Planetary Computer
# The extractor can request both band assets and compute NDVI = (B08 - B04) / (B08 + B04)
ndvi:
  source: "planetary_computer"
  collection: "sentinel-2-l2a"
  assets:
    red: "B04"
    nir: "B08"
  description: "Compute NDVI from Sentinel-2 L2A COG assets (B04, B08) via STAC item assets. Use date selection or latest available per-point as needed."

# Snow: keep CHELSA SCD as a canonical climatology; for near-real-time snow use MODIS/Terra snow products via Planetary Computer STAC
snow:
  chelsa_scd: "https://os.zhdk.cloud.switch.ch/chelsav2/GLOBAL/climatologies/1981-2010/bio/CHELSA_scd_1981-2010_V.2.1.tif"
  planetary:
    source: "planetary_computer"
    collection: "modis-snow"   # MODIS snow collection on Planetary Computer (time-series/tiles)
    asset: "snow_cover"        # asset key to use for MODIS snow COGs
    description: "Use CHELSA SCD for climatology; use MODIS snow assets for time-series when required via STAC"

# Notes for the extractor:
# - For entries with source: planetary_computer, the extractor should use the Planetary Computer STAC endpoint
#   (or pystac-client) to find the nearest STAC item covering the point (and date if time-series), then use the named asset href (HTTP COG) for rasterio sampling.
# - This keeps canonical sources consistent and avoids hardcoding single-item URLs; if you prefer hard-coded example COGs I can expand these to concrete sample hrefs.
